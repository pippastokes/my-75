<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#b69cf7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="My 75" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <title>My 75</title>
</head>
<body>
  <div class="aura aura-one"></div>
  <div class="aura aura-two"></div>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="modeLabel">TEST MODE</p>
        <h1>My 75</h1>
      </div>
      <button class="ghost-icon" id="themeButton" aria-label="Theme">✦</button>
    </header>

    <main>
      <section class="screen active" id="todayScreen"></section>
      <section class="screen" id="calendarScreen"></section>
      <section class="screen" id="progressScreen"></section>
      <section class="screen" id="meScreen"></section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-btn active" data-screen="today"><span>◉</span><small>Today</small></button>
      <button class="nav-btn" data-screen="calendar"><span>◫</span><small>Calendar</small></button>
      <button class="nav-btn" data-screen="progress"><span>◌</span><small>Progress</small></button>
      <button class="nav-btn" data-screen="me"><span>♡</span><small>Me</small></button>
    </nav>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" id="modalContent"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
